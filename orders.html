<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - MediFast</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        /* ========================================
           MediFast - Orders Page
        ======================================== */

        .orders-page {
            padding: 50px 0 80px;
            min-height: 70vh;
        }

        .orders-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .orders-title h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .orders-title p {
            color: #666;
        }

        /* Orders List */

        #orders-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .order-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        /* Order Header */

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eee;
        }

        .order-header h3 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        .order-date {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .order-status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #e8f7ed;
            color: #16803c;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Items */

        .order-items {
            padding: 18px 0;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .order-item-emoji {
            font-size: 24px;
        }

        .order-item-quantity {
            color: #777;
            font-size: 14px;
        }

        .order-item-price {
            font-weight: 600;
            white-space: nowrap;
        }

        /* Order Details */

        .order-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 18px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .order-detail-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .order-detail-box span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .order-detail-box strong {
            display: block;
            font-size: 15px;
        }

        /* Total */

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
        }

        .order-total span {
            font-size: 17px;
            font-weight: 600;
        }

        .order-total strong {
            font-size: 21px;
        }

        /* Buttons */

        .order-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .track-order-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #0b8f55;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.3s;
        }

        .track-order-btn:hover {
            background: #087344;
        }

        /* Empty Orders */

        .no-orders {
            text-align: center;
            padding: 70px 20px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
        }

        .no-orders-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .no-orders h2 {
            margin-bottom: 10px;
        }

        .no-orders p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #0b8f55;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .shop-btn:hover {
            background: #087344;
        }

        /* Responsive */

        @media (max-width: 768px) {

            .orders-page {
                padding: 35px 0 60px;
            }

            .orders-title h1 {
                font-size: 30px;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .order-total {
                flex-direction: row;
            }

            .order-actions {
                justify-content: stretch;
            }

            .track-order-btn {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {

            .order-card {
                padding: 18px;
            }

            .order-item {
                align-items: flex-start;
            }

            .order-item-name {
                align-items: flex-start;
            }

            .order-total strong {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- ========================================
         HEADER
    ======================================== -->

    <header class="header">

        <div class="container">

            <div class="logo">
                <a href="index.html">
                    MediFast
                </a>
            </div>

            <nav class="navbar">

                <a href="index.html">Home</a>

                <a href="products.html">
                    Medicines
                </a>

                <a href="prescription.html">
                    Prescription
                </a>

                <a href="orders.html" class="active">
                    Orders
                </a>

                <a href="cart.html" class="cart-link">
                    Cart
                    <span id="cart-count" class="cart-count">0</span>
                </a>

                <a href="login.html">Login</a>

                <a href="register.html">Register</a>

            </nav>

        </div>

    </header>


    <!-- ========================================
         ORDERS SECTION
    ======================================== -->

    <main class="orders-page">

        <div class="container">

            <div class="orders-title">

                <h1>My Orders</h1>

                <p>
                    View your previous MediFast orders
                    and track your deliveries.
                </p>

            </div>


            <!-- Orders -->

            <div id="orders-list"></div>


            <!-- No Orders -->

            <div
                id="no-orders"
                class="no-orders"
                style="display: none;"
            >

                <div class="no-orders-icon">
                    📦
                </div>

                <h2>No Orders Yet</h2>

                <p>
                    You haven't placed any orders yet.
                    Start shopping for medicines.
                </p>

                <a
                    href="products.html"
                    class="shop-btn"
                >
                    Shop Medicines
                </a>

            </div>

        </div>

    </main>


    <!-- ========================================
         FOOTER
    ======================================== -->

    <footer class="footer">

        <div class="container">

            <p>
                &copy; 2026 MediFast.
                All Rights Reserved.
            </p>

        </div>

    </footer>


    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="js/main.js"></script>
    <script src="js/orders.js"></script>

</body>
</html>
