
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MediFast</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 75px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #f4faff, #ffffff);
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 40px;
            border-radius: 22px;
            border: 1px solid #e4ebf3;
            box-shadow: 0 20px 60px rgba(25, 70, 110, 0.10);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            width: 55px;
            height: 55px;
            margin: 0 auto 15px;
            border-radius: 15px;
            background: #1687ff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .auth-header h1 {
            font-size: 30px;
            margin: 0 0 8px;
        }

        .auth-header p {
            color: #727d8f;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #273247;
        }

        .form-group input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #dce5f0;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #1687ff;
            box-shadow: 0 0 0 3px rgba(22, 135, 255, 0.10);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #1687ff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-submit {
            width: 100%;
            margin-top: 5px;
        }

        .login-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .auth-message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 9px;
            font-size: 13px;
            text-align: center;
        }

        .auth-message.error {
            display: block;
            background: #fff0f0;
            color: #d63031;
        }

        .auth-message.success {
            display: block;
            background: #effff6;
            color: #159957;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #727d8f;
            font-size: 14px;
        }

        .auth-footer a {
            color: #1687ff;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #727d8f;
            font-size: 13px;
            text-decoration: none;
        }

        .back-home:hover {
            color: #1687ff;
        }

        @media (max-width: 500px) {
            .auth-page {
                padding: 35px 15px;
            }

            .auth-card {
                padding: 28px 22px;
            }

            .auth-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                <span class="logo-icon">⚕</span>
                <span>Medi<span>Fast</span></span>
            </a>

            <nav class="navbar">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Medicines
                </a>

                <a href="login.html" class="active">
                    Login
                </a>

            </nav>

            <a href="cart.html" class="cart-button">

                🛒
                <span>Cart</span>

                <span id="cart-count" class="cart-count">
                    0
                </span>

            </a>

        </div>

    </header>


    <!-- ================= LOGIN PAGE ================= -->

    <main class="auth-page">

        <div class="auth-card">

            <!-- Header -->

            <div class="auth-header">

                <div class="auth-logo">
                    ⚕
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to continue shopping with MediFast
                </p>

            </div>


            <!-- Message -->

            <div
                id="auth-message"
                class="auth-message"
                role="alert">
            </div>


            <!-- Login Form -->

            <form id="login-form">

                <!-- Email -->

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="show-login-password">

                            Show

                        </button>

                    </div>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn btn-primary login-submit"
                    id="login-submit">

                    Login

                </button>

            </form>


            <!-- Register -->

            <div class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <!-- Back Home -->

            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>


    <!-- ================= PASSWORD SHOW/HIDE ================= -->

    <script>
        const passwordInput =
            document.getElementById("login-password");

        const showPasswordButton =
            document.getElementById("show-login-password");

        if (passwordInput && showPasswordButton) {

            showPasswordButton.addEventListener(
                "click",
                function () {

                    if (passwordInput.type === "password") {

                        passwordInput.type = "text";
                        showPasswordButton.textContent = "Hide";

                    } else {

                        passwordInput.type = "password";
                        showPasswordButton.textContent = "Show";

                    }

                }
            );
        }
    </script>

</body>
</html>
